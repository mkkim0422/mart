<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검색 링크 폰 테스트</title>
<style>
  body{margin:0; background:#F2F4F6; color:#191F28; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; letter-spacing:-0.02em}
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 48px}
  h1{font-size:21px; margin:0 0 6px}
  p.lead{color:#4E5968; font-size:14px; margin:0 0 16px; line-height:1.55}
  .kw{display:flex; gap:8px; margin-bottom:16px}
  .kw input{flex:1; height:46px; border:1.5px solid #3182F6; border-radius:12px; padding:0 14px; font:inherit; font-size:16px}
  .card{background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:10px}
  .card .t{display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px}
  .badge{font-size:11px; font-weight:600; border-radius:6px; padding:2px 7px}
  .ok{background:#E7F7EF; color:#1F8A5B}
  .try{background:#FFF4E5; color:#B25E00}
  .card small{display:block; color:#8B95A1; font-size:12.5px; margin:4px 0 10px; line-height:1.5}
  a.go{display:flex; align-items:center; justify-content:center; height:44px; border-radius:10px; background:#3182F6; color:#fff; text-decoration:none; font-weight:600; font-size:15px}
  .note{font-size:13px; color:#4E5968; background:#fff; border-radius:14px; padding:14px 16px; line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>쇼핑 앱 검색 링크 테스트</h1>
  <p class="lead">휴대폰에서 이 파일을 열고 버튼을 눌러보세요. 마트노트가 🔍를 눌렀을 때 보내는 것과 똑같은 링크예요. <b>앱 안에서 "우유" 검색 결과가 뜨면 성공</b>이고, 앱 첫 화면만 뜨면 실패예요. 앱이 없으면 Play 스토어가 열려요.</p>
  <div class="kw"><input id="kw" value="우유" aria-label="검색어"></div>
  <div id="list"></div>
  <div class="note">결과를 알려주시면 실패한 앱은 첫 화면 열기로 바꾸고, 성공한 앱은 그대로 둘게요.<br>카카오톡 "나에게 보내기"로 이 파일을 보내서 폰에서 열면 편해요.</div>
</div>
<script>
const e = encodeURIComponent;
// intent:// 형식 = 앱이 Intent에 패키지를 지정해서 보내는 것과 같음 (S.browser_fallback_url 없음 → 앱 없으면 Play 스토어)
const intent = (rest, scheme, pkg) => `intent://${rest}#Intent;scheme=${scheme};package=${pkg};end`;
const TESTS = [
  { name: "쿠팡", st: "ok", note: "실기기 확인됨", link: q => intent(`search?q=${e(q)}`, "coupang", "com.coupang.mobile") },
  { name: "컬리", st: "ok", note: "실기기 확인됨", link: q => intent(`search?keyword=${e(q)}`, "kurly", "com.dbs.kurly.m2") },
  { name: "홈플러스", st: "try", note: "앱 설치 파일에 검색 주소(mfront.homeplus.co.kr/search)를 앱이 받는다고 등록돼 있음", link: q => intent(`mfront.homeplus.co.kr/search?keyword=${e(q)}`, "https", "com.socialapps.homeplus") },
  { name: "11번가", st: "try", note: "앱 코드에 elevenst://loadurl?url= 링크가 있음", link: q => intent(`loadurl?url=${e("https://search.11st.co.kr/MW/search?searchKeyword=" + e(q))}`, "elevenst", "com.elevenst") },
  { name: "G마켓", st: "try", note: "앱 코드에 gmarket://openwindow?targetUrl= 링크가 있음", link: q => intent(`openwindow?title=${e("검색")}&targetUrl=${e("https://m.gmarket.co.kr/n/search?keyword=" + e(q))}`, "gmarket", "com.ebay.kr.gmarket") },
  { name: "옥션", st: "try", note: "G마켓과 같은 회사 앱이라 같은 방식으로 추정", link: q => intent(`openwindow?title=${e("검색")}&targetUrl=${e("https://m.auction.co.kr/n/search?keyword=" + e(q))}`, "auction", "com.ebay.kr.auction") },
  { name: "SSG", st: "try", note: "ssg://execute 링크의 값이 앱 메인으로 넘어감, landingUrl 값 이름은 추정", link: q => intent(`execute?landingUrl=${e("https://m.ssg.com/search.ssg?query=" + e(q))}`, "ssg", "kr.co.ssg") }
];
function render() {
  const q = document.getElementById("kw").value.trim() || "우유";
  document.getElementById("list").innerHTML = TESTS.map(t => `
    <div class="card"><div class="t">${t.name}<span class="badge ${t.st}">${t.st === "ok" ? "확인됨" : "확인 필요"}</span></div>
    <small>${t.note}</small><a class="go" href="${t.link(q)}">${t.name}에서 '${q}' 검색</a></div>`).join("");
}
document.getElementById("kw").addEventListener("input", render);
render();
</script>
</body>
</html>
