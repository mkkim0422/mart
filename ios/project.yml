# 마트노트 iOS — XcodeGen spec. The .xcodeproj is generated (CI: `xcodegen generate`),
# never committed. Open on a Mac: `brew install xcodegen && cd ios && xcodegen && open MartNote.xcodeproj`.
name: MartNote
options:
  bundleIdPrefix: com.rldjrgo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  MartNote:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rldjrgo.grocerynote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 마트노트
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 마트노트
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.rldjrgo.grocerynote
            CFBundleURLSchemes: [martnote]
        NSMicrophoneUsageDescription: 말로 장보기 항목을 추가할 때 마이크를 사용해요.
        NSSpeechRecognitionUsageDescription: 말한 내용을 장보기 항목 이름으로 바꿀 때 사용해요.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/MartNote.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rldjrgo.grocerynote]
    dependencies:
      - target: MartNoteWidget
  MartNoteWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rldjrgo.grocerynote.widget
        INFOPLIST_KEY_CFBundleDisplayName: 마트노트
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 마트노트
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MartNoteWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rldjrgo.grocerynote]
